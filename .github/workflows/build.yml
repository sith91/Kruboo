name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'electron_app/package-lock.json'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'python_backend/requirements.txt'

      - name: Install Python Dependencies & Build Backend
        shell: bash
        run: |
          cd python_backend
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          # Build backend using PyInstaller and backend.spec
          python -m PyInstaller --noconfirm backend.spec
          
          # Copy to Electron App resources folder
          mkdir -p ../electron_app/resources/kruboo_backend
          cp -R dist/kruboo_backend/* ../electron_app/resources/kruboo_backend/
          
          # Set executable permission for Unix-like OS
          if [ "${{ matrix.os }}" != "windows-latest" ]; then
            chmod +x ../electron_app/resources/kruboo_backend/kruboo_backend
          fi

      - name: Install Node.js Dependencies
        run: |
          cd electron_app
          npm ci

      - name: Build and Package Electron App
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd electron_app
          # Packaging target based on OS
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            npm run dist -- --mac
          elif [ "${{ matrix.os }}" = "windows-latest" ]; then
            npm run dist -- --win
          else
            npm run dist -- --linux
          fi
        shell: bash

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            electron_app/dist/*.dmg
            electron_app/dist/*.exe
            electron_app/dist/*.AppImage
            electron_app/dist/*.deb
            electron_app/dist/*.rpm
            electron_app/dist/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
