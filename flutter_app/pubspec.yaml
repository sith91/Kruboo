name: ai_assistant_app
description: A Siri-like AI Assistant Flutter application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  dio: ^5.3.3
  speech_to_text: ^6.5.1
  flutter_tts: ^3.8.3
  record: ^5.0.5
  audioplayers: ^5.2.1
  google_fonts: ^6.1.0
  path_provider: ^2.1.1
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
