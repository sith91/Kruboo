<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VRM 3D Avatar</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            background: transparent;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #vrm-canvas {
            width: 100%;
            height: 100%;
            display: block;
            pointer-events: auto;
        }
        #loader-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.7);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
            letter-spacing: 0.5px;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        #loader-overlay.hidden {
            opacity: 0;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "./three.module.js",
            "three/addons/loaders/GLTFLoader.js": "./GLTFLoader.js",
            "@pixiv/three-vrm": "./three-vrm.module.js"
        }
    }
    </script>
</head>
<body>
    <div id="canvas-container">
        <canvas id="vrm-canvas"></canvas>
        <div id="loader-overlay">Loading Avatar...</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

        const canvas = document.getElementById('vrm-canvas');
        const loaderOverlay = document.getElementById('loader-overlay');

        let scene, camera, renderer, currentVrm, clock;
        let isInitialized = false;

        // Bones
        let headBone = null, neckBone = null, spineBone = null;
        let leftUpperArm = null, rightUpperArm = null;
        let leftLowerArm = null, rightLowerArm = null;

        // Animation states
        let isSpeaking = false;
        let lipSyncVolume = 0;
        let currentEmotion = 'neutral';
        let currentFeeling = 'professional'; // professional, energetic, lethargic, cute
        let touchTarget = { x: 0, y: 0 };
        let blinkTimer = 0, nextBlink = 3.0, isBlinking = false, blinkProgress = 0;
        let speechMouthTimer = 0;

        function notifyFlutter(type, payload = {}) {
            try {
                if (window.FlutterVRMChannel && window.FlutterVRMChannel.postMessage) {
                    window.FlutterVRMChannel.postMessage(JSON.stringify({ type, ...payload }));
                }
            } catch (e) {
                console.warn("Could not notify Flutter:", e);
            }
        }

        function initScene() {
            if (isInitialized) return;

            scene = new THREE.Scene();

            const width = window.innerWidth || 300;
            const height = window.innerHeight || 300;

            camera = new THREE.PerspectiveCamera(30.0, width / height, 0.1, 20.0);
            // Default upper-body framing
            camera.position.set(0.0, 1.35, 0.72);
            camera.lookAt(0.0, 1.28, 0.0);

            // Lighting tailored for Anime / MToon shading
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.4);
            scene.add(ambientLight);

            const keyLight = new THREE.DirectionalLight(0xffffff, 1.8);
            keyLight.position.set(1.0, 1.8, 1.2).normalize();
            scene.add(keyLight);

            const fillLight = new THREE.DirectionalLight(0x70c0ff, 0.9);
            fillLight.position.set(-1.2, 0.8, 1.0).normalize();
            scene.add(fillLight);

            const rimLight = new THREE.DirectionalLight(0xff88ff, 0.75);
            rimLight.position.set(0.0, 1.8, -1.5).normalize();
            scene.add(rimLight);

            renderer = new THREE.WebGLRenderer({
                canvas: canvas,
                alpha: true,
                antialias: true,
                powerPreference: 'high-performance'
            });
            renderer.setSize(width, height, false);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.outputColorSpace = THREE.SRGBColorSpace;

            clock = new THREE.Clock();
            isInitialized = true;

            // Touch / Mouse Tracking for Gaze
            window.addEventListener('touchmove', (e) => {
                if (e.touches && e.touches.length > 0) {
                    const touch = e.touches[0];
                    const centerX = window.innerWidth / 2;
                    const centerY = window.innerHeight / 2;
                    touchTarget.x = Math.max(-1, Math.min(1, (touch.clientX - centerX) / (centerX || 1)));
                    touchTarget.y = Math.max(-1, Math.min(1, (touch.clientY - centerY) / (centerY || 1)));
                }
            }, { passive: true });

            window.addEventListener('mousemove', (e) => {
                const centerX = window.innerWidth / 2;
                const centerY = window.innerHeight / 2;
                touchTarget.x = Math.max(-1, Math.min(1, (e.clientX - centerX) / (centerX || 1)));
                touchTarget.y = Math.max(-1, Math.min(1, (e.clientY - centerY) / (centerY || 1)));
            });

            window.addEventListener('resize', onWindowResize);

            loadVRMModel('../models/default_avatar.vrm');
            animate();
            notifyFlutter('ready');
        }

        function onWindowResize() {
            if (!camera || !renderer) return;
            const width = window.innerWidth || 300;
            const height = window.innerHeight || 300;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height, false);
        }

        function loadVRMModel(modelUrl) {
            if (loaderOverlay) {
                loaderOverlay.classList.remove('hidden');
                loaderOverlay.innerText = "Loading Avatar...";
            }

            const loader = new GLTFLoader();
            loader.register((parser) => new VRMLoaderPlugin(parser));

            loader.load(
                modelUrl,
                (gltf) => {
                    if (currentVrm) {
                        scene.remove(currentVrm.scene);
                        VRMUtils.deepDispose(currentVrm.scene);
                        currentVrm = null;
                    }

                    const vrm = gltf.userData.vrm;
                    if (!vrm) {
                        console.error("No VRM instance in GLTF");
                        if (loaderOverlay) loaderOverlay.innerText = "Avatar error";
                        return;
                    }

                    VRMUtils.rotateVRM0(vrm);
                    scene.add(vrm.scene);
                    currentVrm = vrm;

                    // Locate humanoid bones
                    headBone = vrm.humanoid?.getNormalizedBoneNode('head');
                    neckBone = vrm.humanoid?.getNormalizedBoneNode('neck');
                    spineBone = vrm.humanoid?.getNormalizedBoneNode('spine');
                    leftUpperArm = vrm.humanoid?.getNormalizedBoneNode('leftUpperArm');
                    rightUpperArm = vrm.humanoid?.getNormalizedBoneNode('rightUpperArm');
                    leftLowerArm = vrm.humanoid?.getNormalizedBoneNode('leftLowerArm');
                    rightLowerArm = vrm.humanoid?.getNormalizedBoneNode('rightLowerArm');

                    // Natural resting arm pose
                    if (leftUpperArm) leftUpperArm.rotation.z = 1.15;
                    if (rightUpperArm) rightUpperArm.rotation.z = -1.15;
                    if (leftLowerArm) leftLowerArm.rotation.y = -0.25;
                    if (rightLowerArm) rightLowerArm.rotation.y = 0.25;

                    if (loaderOverlay) {
                        loaderOverlay.classList.add('hidden');
                    }

                    notifyFlutter('loaded', { modelUrl });
                },
                (progress) => {
                    if (progress.total > 0 && loaderOverlay) {
                        const pct = Math.round((progress.loaded / progress.total) * 100);
                        loaderOverlay.innerText = `Loading ${pct}%`;
                    }
                },
                (error) => {
                    console.error("Failed to load VRM:", error);
                    if (loaderOverlay) loaderOverlay.innerText = "Load Failed";
                    notifyFlutter('error', { message: error.toString() });
                }
            );
        }

        function animate() {
            requestAnimationFrame(animate);
            if (!renderer || !scene || !camera) return;

            const delta = clock.getDelta();
            const elapsedTime = clock.getElapsedTime();

            if (currentVrm) {
                // 1. Natural Breathing Motion
                const breathSpeed = isSpeaking ? 3.2 : (currentFeeling === 'energetic' ? 3.0 : 2.0);
                const breathAmp = currentFeeling === 'energetic' ? 0.025 : 0.015;
                const breath = Math.sin(elapsedTime * breathSpeed) * breathAmp;

                if (spineBone) {
                    spineBone.rotation.x = breath * 0.4;
                    spineBone.position.y = breath * 0.08;
                }

                // 2. Head Gaze & Touch Tracking
                if (headBone && neckBone) {
                    const targetYaw = -touchTarget.x * 0.45;
                    const targetPitch = touchTarget.y * 0.35 + (breath * 0.2);

                    headBone.rotation.y = THREE.MathUtils.lerp(headBone.rotation.y, targetYaw * 0.7, 0.08);
                    headBone.rotation.x = THREE.MathUtils.lerp(headBone.rotation.x, targetPitch * 0.6, 0.08);
                    neckBone.rotation.y = THREE.MathUtils.lerp(neckBone.rotation.y, targetYaw * 0.3, 0.08);
                }

                // 3. Natural Auto-Blinking
                blinkTimer += delta;
                if (blinkTimer > nextBlink && !isBlinking) {
                    isBlinking = true;
                    blinkProgress = 0;
                    blinkTimer = 0;
                    nextBlink = 2.5 + Math.random() * 4.0;
                }
                if (isBlinking) {
                    blinkProgress += delta * 9.0;
                    const blinkWeight = Math.sin(Math.min(blinkProgress, Math.PI));
                    setExpressionValue('blink', blinkWeight);
                    if (blinkProgress >= Math.PI) {
                        isBlinking = false;
                        setExpressionValue('blink', 0);
                    }
                }

                // 4. Speech Lip-Sync (Procedural & Amplitude-driven)
                if (isSpeaking) {
                    speechMouthTimer += delta * 12.0;
                    const mouthA = Math.max(0, Math.sin(speechMouthTimer) * 0.7 + lipSyncVolume * 0.3);
                    const mouthI = Math.max(0, Math.cos(speechMouthTimer * 1.3) * 0.4);
                    setExpressionValue('aa', mouthA);
                    setExpressionValue('ih', mouthI);
                } else {
                    setExpressionValue('aa', 0);
                    setExpressionValue('ih', 0);
                    setExpressionValue('ou', 0);
                    setExpressionValue('ee', 0);
                    setExpressionValue('oh', 0);
                }

                // Update VRM Physics / Expressions
                currentVrm.update(delta);
            }

            renderer.render(scene, camera);
        }

        function setExpressionValue(name, value) {
            if (!currentVrm || !currentVrm.expressionManager) return;
            try {
                currentVrm.expressionManager.setValue(name, Math.max(0, Math.min(1, value)));
            } catch (e) {}
        }

        function applyEmotion(emotion) {
            currentEmotion = emotion;
            if (!currentVrm || !currentVrm.expressionManager) return;

            // Clear standard emotions
            ['happy', 'angry', 'sad', 'relaxed', 'surprised'].forEach(emo => {
                setExpressionValue(emo, 0);
            });

            if (emotion === 'happy') setExpressionValue('happy', 0.85);
            else if (emotion === 'angry') setExpressionValue('angry', 0.8);
            else if (emotion === 'sad') setExpressionValue('sad', 0.75);
            else if (emotion === 'surprised') setExpressionValue('surprised', 0.8);
            else if (emotion === 'thinking') {
                setExpressionValue('relaxed', 0.5);
                if (headBone) headBone.rotation.z = 0.15;
            }
        }

        // ══════════════════════════════════════════════════════════════════════
        // Exposed Flutter API
        // ══════════════════════════════════════════════════════════════════════
        window.flutterVRM = {
            setSpeaking: (speaking) => {
                isSpeaking = Boolean(speaking);
                if (!isSpeaking) {
                    setExpressionValue('aa', 0);
                    setExpressionValue('ih', 0);
                }
            },
            setLipSyncVolume: (volume) => {
                lipSyncVolume = Math.max(0, Math.min(1, parseFloat(volume) || 0));
            },
            setExpression: (emotion) => {
                applyEmotion(emotion);
            },
            setFeeling: (feeling) => {
                currentFeeling = feeling;
            },
            loadModelUrl: (url) => {
                loadVRMModel(url);
            },
            setCameraFraming: (mode) => {
                if (!camera) return;
                if (mode === 'full') {
                    camera.position.set(0.0, 0.95, 1.65);
                    camera.lookAt(0.0, 0.85, 0.0);
                } else if (mode === 'bust') {
                    camera.position.set(0.0, 1.25, 0.95);
                    camera.lookAt(0.0, 1.2, 0.0);
                } else {
                    // head / portrait
                    camera.position.set(0.0, 1.35, 0.72);
                    camera.lookAt(0.0, 1.28, 0.0);
                }
            }
        };

        // Initialize on DOM load
        window.addEventListener('DOMContentLoaded', initScene);
    </script>
</body>
</html>
