<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' http://127.0.0.1:8000 ws://127.0.0.1:8000 https://*.googleapis.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>Nexus AI Chat</title>
</head>
<body style="background: transparent; -webkit-app-region: drag;">
    <div id="app" class="nexus-chat">
        <!-- Sidebar for Multi-Chat Management -->
        <aside class="sidebar no-drag">
            <div class="sidebar-header">
                <button id="new-chat-btn" class="new-chat-btn">+ New Chat</button>
            </div>
            <div id="chat-list" class="chat-list">
                <!-- Dynamic Chat List Items -->
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-viewport">
            <header class="chat-header">
                <div class="header-info">
                    <h1 id="current-chat-title">New Conversation</h1>
                    <span id="chat-status" class="status-indicator">Online</span>
                </div>
                <div class="header-actions">
                    <button id="minimize-btn" class="icon-btn">✕</button>
                </div>
            </header>

            <div id="messages-container" class="messages-container no-drag">
                <div class="message assistant">
                    <div class="message-bubble">
                        Welcome to Nexus AI. I'm ready to assist with text or voice commands.
                    </div>
                </div>
            </div>

            <div class="input-container no-drag">
                <div class="input-wrapper">
                    <textarea id="prompt-input" placeholder="Ask me anything..." rows="1"></textarea>
                    <button id="send-btn" class="send-btn" title="Send">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="19" x2="12" y2="5"/>
                            <polyline points="5 12 12 5 19 12"/>
                        </svg>
                    </button>
                    <button id="stop-btn" class="stop-btn" title="Stop" style="display: none;">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Lock Screen Overlay -->
    <div id="lock-screen" class="lock-overlay" style="display: none;">
        <div class="lock-card glass">
            <div class="lock-icon">🔒</div>
            <h2>Nexus AI Locked</h2>
            <p>Enter master passcode to continue</p>
            <div class="passcode-input-container">
                <input type="password" id="master-passcode" placeholder="••••" maxlength="6">
                <button id="unlock-btn">Unlock</button>
            </div>
            <div id="unlock-error" class="error-text"></div>
        </div>
    </div>

    <!-- Modified renderer logic is integrated but we will update renderer.js as well -->
    <script src="renderer.js"></script>
    <style>
        .lock-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 10000;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(20px);
        }
        .lock-card {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            padding: 40px; border-radius: 24px; text-align: center; width: 320px;
        }
        .lock-icon { font-size: 40px; margin-bottom: 20px; }
        .lock-card h2 { font-size: 18px; margin: 0 0 10px; font-weight: 600; color: #fff; }
        .lock-card p { font-size: 13px; color: #777; margin-bottom: 30px; }
        .passcode-input-container { display: flex; flex-direction: column; gap: 12px; }
        #master-passcode {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: #fff; text-align: center; font-size: 24px; letter-spacing: 8px;
            padding: 12px; border-radius: 12px; outline: none;
        }
        #unlock-btn {
            background: #4A90E2; color: white; border: none; padding: 12px;
            border-radius: 12px; font-weight: 600; cursor: pointer;
        }
        .error-text { color: #ff4d4d; font-size: 12px; margin-top: 15px; min-height: 15px; }
    </style>
</body>
</html>
