<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' http://127.0.0.1:* ws://127.0.0.1:* https://*.googleapis.com data: blob:; img-src 'self' http://127.0.0.1:* data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
    {
        "imports": {
            "three": "./node_modules/three/build/three.module.js",
            "three/addons/": "./node_modules/three/examples/jsm/",
            "@pixiv/three-vrm": "./node_modules/@pixiv/three-vrm/lib/three-vrm.module.js"
        }
    }
    </script>
    <style>
        * { box-sizing: border-box; }

        body {
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh; width: 100vw;
            flex-direction: column;
            gap: 12px;
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0; padding: 0;
            -webkit-user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Orb Wrapper ── */
        .orb-wrapper {
            position: relative;
            width: 130px; height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-app-region: drag;
        }

        .main-orb {
            width: 70px; height: 70px;
            border-radius: 50%;
            cursor: pointer;
            position: relative;
            background: radial-gradient(circle at 30% 30%, #00f2fe, #4facfe 35%, #ff0844 70%, #9b51e0 100%);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.15) inset,
                0 0 35px rgba(0, 242, 254, 0.65),
                0 0 75px rgba(255, 8, 68, 0.35),
                0 16px 40px rgba(0,0,0,0.55);
            border: 1px solid rgba(255,255,255,0.2);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.35s;
            animation: siri-swirl 8s infinite ease-in-out;
            z-index: 10;
            -webkit-app-region: no-drag;
            overflow: hidden;
        }

        /* VRM 3D Avatar Mode */
        .orb-wrapper.vrm-full-mode {
            width: 220px !important;
            height: 310px !important;
        }
        .main-orb.vrm-mode {
            width: 90px !important;
            height: 90px !important;
            background: radial-gradient(circle at 50% 50%, rgba(30, 41, 59, 0.75), rgba(15, 23, 42, 0.95)) !important;
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.25) inset,
                0 0 35px rgba(0, 242, 254, 0.5),
                0 0 60px rgba(124, 58, 237, 0.35),
                0 14px 36px rgba(0,0,0,0.55) !important;
            border: 1.5px solid rgba(255,255,255,0.3) !important;
            animation: none !important;
        }
        .main-orb.vrm-mode.full-body {
            width: 210px !important;
            height: 290px !important;
            border-radius: 16px !important;
            background: transparent !important;
            box-shadow: none !important;
            border: none !important;
        }
        .main-orb.vrm-mode::before {
            display: none !important;
        }
        .listening .main-orb.vrm-mode {
            box-shadow:
                0 0 0 1.5px rgba(255,255,255,0.4) inset,
                0 0 45px rgba(0, 242, 254, 0.9),
                0 0 75px rgba(255, 0, 127, 0.6),
                0 18px 44px rgba(0,0,0,0.65) !important;
            animation: none !important;
            transform: scale(1.08) !important;
        }
        .listening .main-orb.vrm-mode.full-body {
            box-shadow: none !important;
            filter: drop-shadow(0 0 25px rgba(0, 242, 254, 0.85)) drop-shadow(0 0 45px rgba(124, 58, 237, 0.55)) !important;
            transform: scale(1.03) !important;
        }

        #vrm-canvas {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0;
            border-radius: 50%;
            pointer-events: none;
            z-index: 12;
            display: none;
        }
        #vrm-canvas.full-body {
            border-radius: 16px !important;
        }

        @keyframes siri-swirl {
            0% {
                background: radial-gradient(circle at 30% 30%, #00f2fe, #4facfe 35%, #ff0844 70%, #9b51e0 100%);
                box-shadow:
                    0 0 0 1px rgba(255,255,255,0.15) inset,
                    0 0 35px rgba(0, 242, 254, 0.65),
                    0 0 75px rgba(255, 8, 68, 0.35),
                    0 16px 40px rgba(0,0,0,0.55);
            }
            33% {
                background: radial-gradient(circle at 70% 30%, #ff0844, #9b51e0 35%, #00f2fe 70%, #4facfe 100%);
                box-shadow:
                    0 0 0 1px rgba(255,255,255,0.15) inset,
                    0 0 35px rgba(255, 8, 68, 0.65),
                    0 0 75px rgba(155, 81, 224, 0.35),
                    0 16px 40px rgba(0,0,0,0.55);
            }
            66% {
                background: radial-gradient(circle at 50% 80%, #9b51e0, #00f2fe 35%, #4facfe 70%, #ff0844 100%);
                box-shadow:
                    0 0 0 1px rgba(255,255,255,0.15) inset,
                    0 0 35px rgba(155, 81, 224, 0.65),
                    0 0 75px rgba(0, 242, 254, 0.35),
                    0 16px 40px rgba(0,0,0,0.55);
            }
            100% {
                background: radial-gradient(circle at 30% 30%, #00f2fe, #4facfe 35%, #ff0844 70%, #9b51e0 100%);
                box-shadow:
                    0 0 0 1px rgba(255,255,255,0.15) inset,
                    0 0 35px rgba(0, 242, 254, 0.65),
                    0 0 75px rgba(255, 8, 68, 0.35),
                    0 16px 40px rgba(0,0,0,0.55);
            }
        }

        /* Glossy sheen */
        .main-orb::before {
            content: '';
            position: absolute;
            top: 10%; left: 16%;
            width: 44%; height: 32%;
            background: radial-gradient(ellipse, rgba(255,255,255,0.5) 0%, transparent 75%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 15;
        }

        .main-orb:hover {
            transform: scale(1.1);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.2) inset,
                0 0 65px rgba(124, 58, 237, 0.85),
                0 0 120px rgba(109, 40, 217, 0.38),
                0 20px 48px rgba(0,0,0,0.6);
        }

        /* ── Aura Rings ── */
        .aura {
            position: absolute;
            width: 84px; height: 84px;
            border-radius: 50%;
            border: 1px solid rgba(139, 92, 246, 0.3);
            opacity: 0;
            pointer-events: none;
        }

        .listening .aura {
            animation: aura-expand 2s infinite ease-out;
            opacity: 1;
        }
        .listening .aura:nth-child(1) { animation-delay: 0s;    border-color: rgba(255, 0, 127, 0.5); }
        .listening .aura:nth-child(2) { animation-delay: 0.65s; border-color: rgba(0, 242, 254, 0.35); }
        .listening .aura:nth-child(3) { animation-delay: 1.3s;  border-color: rgba(155, 81, 224, 0.2); }

        @keyframes aura-expand {
            0%   { transform: scale(0.95); opacity: 0.85; }
            100% { transform: scale(2.7);  opacity: 0; }
        }

        /* ── Waveform ── */
        .waveform {
            display: none;
            position: absolute;
            bottom: 18px;
            width: 110px; height: 36px;
            gap: 3px;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 20;
        }
        .listening .waveform { display: flex; }

        .bar {
            width: 2px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.7);
            animation: wave-bounce 1s infinite ease-in-out;
        }
        .bar:nth-child(1) { height: 8px;  animation-delay: 0s;    }
        .bar:nth-child(2) { height: 14px; animation-delay: 0.10s; }
        .bar:nth-child(3) { height: 24px; animation-delay: 0.20s; }
        .bar:nth-child(4) { height: 18px; animation-delay: 0.30s; }
        .bar:nth-child(5) { height: 28px; animation-delay: 0.20s; }
        .bar:nth-child(6) { height: 14px; animation-delay: 0.10s; }
        .bar:nth-child(7) { height: 8px;  animation-delay: 0s;    }

        @keyframes wave-bounce {
            0%, 100% { transform: scaleY(1);   }
            50%       { transform: scaleY(1.7); }
        }

        /* ── Status Label ── */
        .orb-status {
            font-size: 9.5px;
            font-weight: 500;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.75);
            background: rgba(28, 28, 30, 0.55);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 5px 14px;
            border-radius: 30px;
            border: 0.5px solid rgba(255, 255, 255, 0.15);
            max-width: 220px;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ── Listening State (Orb) ── */
        .listening .main-orb:not(.vrm-mode) {
            animation: siri-listen-swirl 1.2s infinite ease-in-out;
        }
        @keyframes siri-listen-swirl {
            0% {
                transform: scale(1.1);
                background: radial-gradient(circle at 20% 20%, #ff007f, #7f00ff 40%, #00f2fe 80%);
                box-shadow:
                    0 0 0 1px rgba(255,255,255,0.2) inset,
                    0 0 50px rgba(255, 0, 127, 0.85),
                    0 0 90px rgba(127, 0, 255, 0.45),
                    0 16px 40px rgba(0,0,0,0.6);
            }
            50% {
                transform: scale(1.22);
                background: radial-gradient(circle at 80% 80%, #00f2fe, #ff007f 40%, #7f00ff 80%);
                box-shadow:
                    0 0 0 1px rgba(255,255,255,0.25) inset,
                    0 0 65px rgba(0, 242, 254, 0.95),
                    0 0 110px rgba(255, 0, 127, 0.55),
                    0 16px 40px rgba(0,0,0,0.6);
            }
            100% {
                transform: scale(1.1);
                background: radial-gradient(circle at 20% 20%, #ff007f, #7f00ff 40%, #00f2fe 80%);
                box-shadow:
                    0 0 0 1px rgba(255,255,255,0.2) inset,
                    0 0 50px rgba(255, 0, 127, 0.85),
                    0 0 90px rgba(127, 0, 255, 0.45),
                    0 16px 40px rgba(0,0,0,0.6);
            }
        }

        /* ── Context Menu (macOS popover) ── */
        .context-menu {
            position: absolute;
            background: rgba(28, 28, 30, 0.85);
            backdrop-filter: saturate(180%) blur(36px);
            -webkit-backdrop-filter: saturate(180%) blur(36px);
            border: 0.5px solid rgba(255, 255, 255, 0.18);
            border-radius: 16px;
            padding: 8px;
            display: none;
            flex-direction: row;
            gap: 2px;
            z-index: 100;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.55);
            animation: pop 0.18s cubic-bezier(0.34, 1.4, 0.64, 1);
        }
        .context-menu.visible { display: flex; }

        @keyframes pop {
            from { transform: translate(-50%, -50%) scale(0.85); opacity: 0; }
            to   { transform: translate(-50%, -50%) scale(1);    opacity: 1; }
        }

        /* ── Menu Items ── */
        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            padding: 10px 12px;
            border-radius: 11px;
            transition: background 0.1s, transform 0.1s;
            color: rgba(255, 255, 255, 0.85);
            font-size: 9.5px;
            font-weight: 500;
            min-width: 62px;
        }
        .menu-item:hover  { background: rgba(255, 255, 255, 0.08); }
        .menu-item:active { background: rgba(255, 255, 255, 0.04); transform: scale(0.94); }
        .menu-item + .menu-item { border-left: 0.5px solid rgba(255, 255, 255, 0.07); }

        .menu-icon {
            width: 34px; height: 34px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        .menu-item:hover .menu-icon { background: rgba(255, 255, 255, 0.12); }

        /* ── Suggestion Card ── */
        .suggestion-card {
            margin-top: 4px;
            background: rgba(28, 28, 30, 0.8);
            backdrop-filter: saturate(180%) blur(28px);
            -webkit-backdrop-filter: saturate(180%) blur(28px);
            border: 0.5px solid rgba(255, 255, 255, 0.14);
            border-radius: 14px;
            padding: 10px 12px;
            color: rgba(255, 255, 255, 0.85);
            font-size: 11.5px;
            display: none;
            flex-direction: column;
            gap: 5px;
            max-width: 240px;
            text-align: left;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
            animation: pop 0.2s cubic-bezier(0.34, 1.4, 0.64, 1);
        }
        .suggestion-label {
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.9px;
            color: rgba(255, 255, 255, 0.4);
        }
        .suggestion-card a {
            color: #0A84FF;
            text-decoration: none;
            font-size: 12px;
            font-weight: 400;
            padding: 5px 8px;
            border-radius: 8px;
            background: rgba(10, 132, 255, 0.1);
            transition: background 0.1s, transform 0.1s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .suggestion-card a::before { content: '↗'; font-size: 9px; opacity: 0.5; }
        .suggestion-card a:hover  { background: rgba(10, 132, 255, 0.18); }
        .suggestion-card a:active { transform: scale(0.97); }
    </style>
</head>
<body id="main-body">

    <div class="orb-status" id="orb-status">KRUUBOO</div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

        const orbBtn = document.getElementById('orb-button');
        const statusText = document.getElementById('orb-status');
        const container = document.getElementById('orb-container');
        const contextMenu = document.getElementById('context-menu');
        const menuChat = document.getElementById('menu-chat');
        const menuSettings = document.getElementById('menu-settings');
        const menuHide = document.getElementById('menu-hide');
        const petAvatar = document.getElementById('pet-avatar');
        const vrmCanvas = document.getElementById('vrm-canvas');

        let isListening = false;
        let isAgentSpeaking = false;
        let activeAudio = null;
        let currentOrbState = 'idle';
        let uiStrings = {};

        // ══════════════════════════════════════════════════════════════════════
        // 3D VRM Model Rendering Engine
        // ══════════════════════════════════════════════════════════════════════
        let vrmScene, vrmCamera, vrmRenderer, currentVrm, vrmClock;
        let isVRMInitialized = false;
        let mouseTarget = { x: 0, y: 0 };
        let headBone = null, neckBone = null, spineBone = null;
        let leftUpperArm = null, rightUpperArm = null;
        let leftLowerArm = null, rightLowerArm = null;
        let leftHand = null, rightHand = null;
        let blinkTimer = 0, nextBlinkInterval = 3.0, isBlinking = false, blinkProgress = 0;
        let lipSyncTimer = 0;
        let currentLoadedVrmUrl = null;

        function initVRMScene() {
            if (isVRMInitialized) return;
            if (!vrmCanvas) return;

            vrmScene = new THREE.Scene();

            vrmCamera = new THREE.PerspectiveCamera(30.0, 1.0, 0.1, 20.0);
            vrmCamera.position.set(0.0, 1.4, 0.68);

            // Atmospheric & directional lights for anime/MToon shading
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.35);
            vrmScene.add(ambientLight);

            const keyLight = new THREE.DirectionalLight(0xffffff, 1.8);
            keyLight.position.set(1.0, 1.8, 1.2).normalize();
            vrmScene.add(keyLight);

            const fillLight = new THREE.DirectionalLight(0x70c0ff, 0.9);
            fillLight.position.set(-1.2, 0.8, 1.0).normalize();
            vrmScene.add(fillLight);

            const rimLight = new THREE.DirectionalLight(0xff88ff, 0.75);
            rimLight.position.set(0.0, 1.8, -1.5).normalize();
            vrmScene.add(rimLight);

            vrmRenderer = new THREE.WebGLRenderer({
                canvas: vrmCanvas,
                alpha: true,
                antialias: true,
                powerPreference: 'high-performance'
            });
            vrmRenderer.setSize(140, 140, false);
            vrmRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            vrmRenderer.outputColorSpace = THREE.SRGBColorSpace;

            vrmClock = new THREE.Clock();
            isVRMInitialized = true;

            window.addEventListener('mousemove', (e) => {
                const rect = vrmCanvas.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                mouseTarget.x = Math.max(-1, Math.min(1, (e.clientX - centerX) / (window.innerWidth / 2)));
                mouseTarget.y = Math.max(-1, Math.min(1, (e.clientY - centerY) / (window.innerHeight / 2)));
            });

            loadVRMModel();
            animateVRM();
        }

        async function loadVRMModel(forceReload = false) {
            if (!isVRMInitialized) return;

            let modelUrl = './assets/models/default_avatar.vrm';
            try {
                const checkRes = await fetch(`${window.aiBackend.baseUrl}/vrm_info?t=${Date.now()}`);
                if (checkRes.ok) {
                    const info = await checkRes.json();
                    if (info.has_custom) {
                        modelUrl = `${window.aiBackend.baseUrl}/avatar_vrm?t=${Date.now()}`;
                    }
                }
            } catch(e) {
                console.warn("Could not check /vrm_info:", e);
            }

            if (currentVrm && currentLoadedVrmUrl === modelUrl && !forceReload) {
                return;
            }

            const loader = new GLTFLoader();
            loader.register((parser) => new VRMLoaderPlugin(parser));

            loader.load(
                modelUrl,
                (gltf) => {
                    if (currentVrm) {
                        vrmScene.remove(currentVrm.scene);
                        VRMUtils.deepDispose(currentVrm.scene);
                        currentVrm = null;
                    }

                    const vrm = gltf.userData.vrm;
                    if (!vrm) {
                        console.error("No VRM instance found in loaded GLTF");
                        return;
                    }

                    VRMUtils.rotateVRM0(vrm);
                    vrmScene.add(vrm.scene);
                    currentVrm = vrm;
                    currentLoadedVrmUrl = modelUrl;

                    headBone = vrm.humanoid?.getNormalizedBoneNode('head');
                    neckBone = vrm.humanoid?.getNormalizedBoneNode('neck');
                    spineBone = vrm.humanoid?.getNormalizedBoneNode('spine');
                    leftUpperArm = vrm.humanoid?.getNormalizedBoneNode('leftUpperArm');
                    rightUpperArm = vrm.humanoid?.getNormalizedBoneNode('rightUpperArm');
                    leftLowerArm = vrm.humanoid?.getNormalizedBoneNode('leftLowerArm');
                    rightLowerArm = vrm.humanoid?.getNormalizedBoneNode('rightLowerArm');
                    leftHand = vrm.humanoid?.getNormalizedBoneNode('leftHand');
                    rightHand = vrm.humanoid?.getNormalizedBoneNode('rightHand');

                    const settings = getAppSettings();
                    applyOrbVRMFraming(settings.vrmDisplayMode || 'orb');

                    console.log("3D VRM Avatar loaded and framed:", modelUrl);
                },
                undefined,
                (error) => {
                    console.error("VRM Load Error:", error);
                    if (modelUrl !== './assets/models/default_avatar.vrm') {
                        loader.load('./assets/models/default_avatar.vrm', (gltf) => {
                            if (gltf.userData.vrm) {
                                const vrm = gltf.userData.vrm;
                                VRMUtils.rotateVRM0(vrm);
                                vrmScene.add(vrm.scene);
                                currentVrm = vrm;
                            }
                        });
                    }
                }
            );
        }

        function animateVRM() {
            requestAnimationFrame(animateVRM);
            if (!vrmRenderer || !vrmScene || !vrmCamera) return;

            const delta = vrmClock.getDelta();
            const elapsedTime = vrmClock.getElapsedTime();

            const settings = getAppSettings();
            const avatarMode = settings.avatarMode || 'globe';

            if (avatarMode !== 'vrm') {
                return;
            }

            if (currentVrm) {
                // 1. Natural Breathing Idle Motion
                const settings = getAppSettings();
                const feeling = settings.feeling || 'professional';

                // 1. Natural Breathing Idle Motion & Spine Attitude
                const breathSpeed = (feeling === 'energetic' || isAgentSpeaking) ? 3.0 : (feeling === 'lethargic') ? 1.4 : 2.2;
                const breathAmp = (feeling === 'energetic') ? 0.025 : (feeling === 'lethargic') ? 0.008 : 0.015;
                const breath = Math.sin(elapsedTime * breathSpeed) * breathAmp;
                
                let targetSpineX = breath;
                let targetSpineY = 0;
                let targetSpineZ = 0;

                // Base Natural Resting Posture
                const armSway = Math.sin(elapsedTime * 1.8) * 0.025;
                let targetLeftUpperArmZ = -1.22 + armSway;
                let targetLeftUpperArmX = 0.14 + (breath * 0.5);
                let targetLeftUpperArmY = 0.08;

                let targetRightUpperArmZ = 1.22 - armSway;
                let targetRightUpperArmX = 0.14 + (breath * 0.5);
                let targetRightUpperArmY = -0.08;

                let targetLeftLowerArmZ = -0.12;
                let targetLeftLowerArmY = 0.22;
                let targetLeftLowerArmX = -0.25;

                let targetRightLowerArmZ = 0.12;
                let targetRightLowerArmY = -0.22;
                let targetRightLowerArmX = -0.25;

                let targetLeftHandZ = -0.05;
                let targetLeftHandX = 0;
                let targetLeftHandY = 0;

                let targetRightHandZ = 0.05;
                let targetRightHandX = 0;
                let targetRightHandY = 0;

                // ── State-Based Arm & Body Mimicking ──
                if (currentOrbState === 'listening') {
                    // Attentive Listening Pose: Lean forward, open receptive arms & hands
                    targetSpineX = -0.04 + (breath * 0.6);
                    targetLeftUpperArmZ = -1.02;
                    targetLeftUpperArmX = 0.32 + Math.sin(elapsedTime * 2.2) * 0.02;
                    targetLeftUpperArmY = 0.18;
                    targetLeftLowerArmX = -0.58;
                    targetLeftLowerArmY = 0.38;
                    targetLeftHandX = 0.18;

                    targetRightUpperArmZ = 1.02;
                    targetRightUpperArmX = 0.32 + Math.sin(elapsedTime * 2.2) * 0.02;
                    targetRightUpperArmY = -0.18;
                    targetRightLowerArmX = -0.58;
                    targetRightLowerArmY = -0.38;
                    targetRightHandX = 0.18;
                } else if (currentOrbState === 'thinking') {
                    // Contemplative Thinking Pose: Hand near chin, thoughtful posture
                    targetSpineX = 0.02;
                    targetSpineY = 0.03;
                    targetRightUpperArmZ = 0.55;
                    targetRightUpperArmX = 0.65;
                    targetRightUpperArmY = -0.25;
                    targetRightLowerArmX = -1.45 + Math.sin(elapsedTime * 1.8) * 0.03;
                    targetRightLowerArmY = -0.55;
                    targetRightLowerArmZ = 0.3;
                    targetRightHandX = 0.35;
                    targetRightHandY = -0.2;

                    targetLeftUpperArmZ = -0.85;
                    targetLeftUpperArmX = 0.42;
                    targetLeftUpperArmY = 0.25;
                    targetLeftLowerArmX = -0.95;
                    targetLeftLowerArmY = 0.6;
                    targetLeftLowerArmZ = -0.2;
                } else if (isAgentSpeaking || currentOrbState === 'speaking') {
                    // Dynamic Conversational Gestures Synced to Speech Cadence
                    const g1 = Math.sin(elapsedTime * 3.6) * 0.22;
                    const g2 = Math.cos(elapsedTime * 2.8) * 0.18;
                    const gHand = Math.sin(elapsedTime * 4.0) * 0.25;

                    targetSpineX = breath + (g1 * 0.05);
                    targetLeftUpperArmZ = -1.05 + (g1 * 0.45);
                    targetLeftUpperArmX = 0.35 + g2;
                    targetLeftUpperArmY = 0.16;
                    targetLeftLowerArmX = -0.65 - (Math.abs(g1) * 0.55);
                    targetLeftLowerArmY = 0.35 + (g2 * 0.35);
                    targetLeftHandX = gHand;
                    targetLeftHandY = g1 * 0.4;

                    targetRightUpperArmZ = 1.05 - (g2 * 0.45);
                    targetRightUpperArmX = 0.35 + g1;
                    targetRightUpperArmY = -0.16;
                    targetRightLowerArmX = -0.65 - (Math.abs(g2) * 0.55);
                    targetRightLowerArmY = -0.35 - (g1 * 0.35);
                    targetRightHandX = -gHand;
                    targetRightHandY = -g2 * 0.4;
                }

                // ── Persona & Feeling Modifiers ──
                if (feeling === 'energetic') {
                    const energyBounce = Math.sin(elapsedTime * 4.0) * 0.03;
                    targetSpineX += energyBounce;
                    targetLeftUpperArmZ += 0.12;
                    targetRightUpperArmZ -= 0.12;
                } else if (feeling === 'romantic') {
                    const swaySoft = Math.sin(elapsedTime * 1.5) * 0.03;
                    targetSpineZ = swaySoft * 0.5;
                    targetLeftUpperArmZ += 0.08;
                    targetRightUpperArmZ -= 0.08;
                    targetLeftLowerArmX -= 0.15;
                    targetRightLowerArmX -= 0.15;
                } else if (feeling === 'sarcastic' || feeling === 'arrogant') {
                    targetSpineY = 0.04;
                    targetRightUpperArmZ = 0.85;
                    targetRightLowerArmX = -0.95;
                    targetRightLowerArmY = -0.65;
                } else if (feeling === 'lethargic') {
                    targetSpineX = 0.08 + (breath * 0.5); // slouched
                    targetLeftUpperArmZ = -1.35;
                    targetRightUpperArmZ = 1.35;
                    targetLeftLowerArmX = -0.05;
                    targetRightLowerArmX = -0.05;
                }

                // Smoothly Interpolate (Lerp) Bone Transforms for Butter-Smooth Transitions
                const lerpArm = 0.085;
                if (spineBone) {
                    spineBone.rotation.x = THREE.MathUtils.lerp(spineBone.rotation.x, targetSpineX, lerpArm);
                    spineBone.rotation.y = THREE.MathUtils.lerp(spineBone.rotation.y, targetSpineY, lerpArm);
                    spineBone.rotation.z = THREE.MathUtils.lerp(spineBone.rotation.z, targetSpineZ, lerpArm);
                }
                if (leftUpperArm) {
                    leftUpperArm.rotation.z = THREE.MathUtils.lerp(leftUpperArm.rotation.z, targetLeftUpperArmZ, lerpArm);
                    leftUpperArm.rotation.x = THREE.MathUtils.lerp(leftUpperArm.rotation.x, targetLeftUpperArmX, lerpArm);
                    leftUpperArm.rotation.y = THREE.MathUtils.lerp(leftUpperArm.rotation.y, targetLeftUpperArmY, lerpArm);
                }
                if (rightUpperArm) {
                    rightUpperArm.rotation.z = THREE.MathUtils.lerp(rightUpperArm.rotation.z, targetRightUpperArmZ, lerpArm);
                    rightUpperArm.rotation.x = THREE.MathUtils.lerp(rightUpperArm.rotation.x, targetRightUpperArmX, lerpArm);
                    rightUpperArm.rotation.y = THREE.MathUtils.lerp(rightUpperArm.rotation.y, targetRightUpperArmY, lerpArm);
                }
                if (leftLowerArm) {
                    leftLowerArm.rotation.z = THREE.MathUtils.lerp(leftLowerArm.rotation.z, targetLeftLowerArmZ, lerpArm);
                    leftLowerArm.rotation.x = THREE.MathUtils.lerp(leftLowerArm.rotation.x, targetLeftLowerArmX, lerpArm);
                    leftLowerArm.rotation.y = THREE.MathUtils.lerp(leftLowerArm.rotation.y, targetLeftLowerArmY, lerpArm);
                }
                if (rightLowerArm) {
                    rightLowerArm.rotation.z = THREE.MathUtils.lerp(rightLowerArm.rotation.z, targetRightLowerArmZ, lerpArm);
                    rightLowerArm.rotation.x = THREE.MathUtils.lerp(rightLowerArm.rotation.x, targetRightLowerArmX, lerpArm);
                    rightLowerArm.rotation.y = THREE.MathUtils.lerp(rightLowerArm.rotation.y, targetRightLowerArmY, lerpArm);
                }
                if (leftHand) {
                    leftHand.rotation.z = THREE.MathUtils.lerp(leftHand.rotation.z, targetLeftHandZ, lerpArm);
                    leftHand.rotation.x = THREE.MathUtils.lerp(leftHand.rotation.x, targetLeftHandX, lerpArm);
                    leftHand.rotation.y = THREE.MathUtils.lerp(leftHand.rotation.y, targetLeftHandY, lerpArm);
                }
                if (rightHand) {
                    rightHand.rotation.z = THREE.MathUtils.lerp(rightHand.rotation.z, targetRightHandZ, lerpArm);
                    rightHand.rotation.x = THREE.MathUtils.lerp(rightHand.rotation.x, targetRightHandX, lerpArm);
                    rightHand.rotation.y = THREE.MathUtils.lerp(rightHand.rotation.y, targetRightHandY, lerpArm);
                }

                // 2. Cursor Gaze & Head Tracking with smooth lerp
                if (headBone) {
                    const targetRotY = THREE.MathUtils.lerp(headBone.rotation.y, mouseTarget.x * 0.25, 0.08);
                    const targetRotX = THREE.MathUtils.lerp(headBone.rotation.x, -mouseTarget.y * 0.18 + breath * 0.5, 0.08);
                    headBone.rotation.y = targetRotY;
                    headBone.rotation.x = targetRotX;
                }

                // 3. Eye Blinking Cycle
                blinkTimer += delta;
                if (!isBlinking && blinkTimer >= nextBlinkInterval) {
                    isBlinking = true;
                    blinkTimer = 0;
                    blinkProgress = 0;
                    nextBlinkInterval = 2.5 + Math.random() * 3.0;
                }

                if (isBlinking) {
                    blinkProgress += delta * 12.0;
                    let blinkWeight = 0;
                    if (blinkProgress < 1.0) {
                        blinkWeight = Math.sin(blinkProgress * Math.PI);
                    } else {
                        isBlinking = false;
                        blinkWeight = 0;
                    }
                    if (currentVrm.expressionManager) {
                        currentVrm.expressionManager.setValue('blink', blinkWeight);
                    }
                }

                // 4. Emotional Expression States
                if (currentVrm.expressionManager) {
                    if (currentOrbState === 'listening') {
                        currentVrm.expressionManager.setValue('happy', 0.35);
                        currentVrm.expressionManager.setValue('surprised', 0.25);
                        currentVrm.expressionManager.setValue('neutral', 0.4);
                    } else if (currentOrbState === 'thinking') {
                        currentVrm.expressionManager.setValue('happy', 0.0);
                        currentVrm.expressionManager.setValue('surprised', 0.0);
                        currentVrm.expressionManager.setValue('neutral', 0.85);
                    } else if (isAgentSpeaking || currentOrbState === 'speaking') {
                        currentVrm.expressionManager.setValue('happy', 0.45);
                        currentVrm.expressionManager.setValue('surprised', 0.0);
                        currentVrm.expressionManager.setValue('neutral', 0.3);
                    } else {
                        // Idle
                        currentVrm.expressionManager.setValue('happy', 0.15);
                        currentVrm.expressionManager.setValue('surprised', 0.0);
                        currentVrm.expressionManager.setValue('neutral', 0.7);
                    }

                    // 5. Lip Sync / Mouth Visemes during speech
                    if (isAgentSpeaking || currentOrbState === 'speaking') {
                        lipSyncTimer += delta * 14.0;
                        const mouthOpen = (Math.sin(lipSyncTimer) + 1.0) * 0.5;
                        const visemeIndex = Math.floor(elapsedTime * 4.0) % 4;
                        const visemes = ['aa', 'oh', 'ih', 'ee'];
                        
                        visemes.forEach((v, idx) => {
                            const weight = (idx === visemeIndex) ? mouthOpen * 0.75 : 0;
                            currentVrm.expressionManager.setValue(v, weight);
                        });
                    } else {
                        ['aa', 'ih', 'ou', 'ee', 'oh'].forEach(v => {
                            currentVrm.expressionManager.setValue(v, 0);
                        });
                    }

                    currentVrm.expressionManager.update();
                }

                currentVrm.update(delta);
            }

            vrmRenderer.render(vrmScene, vrmCamera);
        }

        function applyOrbVRMFraming(displayMode = 'orb') {
            if (!currentVrm || !vrmCamera) return;
            const settings = getAppSettings();
            const scale = settings.avatarScale || 1.0;
            const box = new THREE.Box3().setFromObject(currentVrm.scene);
            const size = new THREE.Vector3();
            box.getSize(size);
            const center = new THREE.Vector3();
            box.getCenter(center);
            const headBone = currentVrm.humanoid?.getNormalizedBoneNode('head');

            if (displayMode === 'full') {
                const targetH = Math.round(Math.max(260, Math.min(680, 340 * (size.y || 1.4) * scale)));
                const targetW = Math.round(Math.max(180, Math.min(500, targetH * 0.72)));
                
                container.style.width = targetW + 'px';
                container.style.height = targetH + 'px';
                orbBtn.style.width = (targetW - 10) + 'px';
                orbBtn.style.height = (targetH - 10) + 'px';

                if (window.aiBackend && window.aiBackend.resizeOrbWindow) {
                    window.aiBackend.resizeOrbWindow(targetW + 20, targetH + 34);
                }

                const fov = vrmCamera.fov * (Math.PI / 180);
                const camDist = Math.max(1.0, (size.y * 0.58) / Math.tan(fov / 2));
                vrmCamera.position.set(center.x, center.y + (size.y * 0.04), center.z + camDist);
                vrmCamera.lookAt(center.x, center.y + (size.y * 0.04), center.z);
                vrmCamera.aspect = targetW / targetH;
                vrmCamera.updateProjectionMatrix();
                if (vrmRenderer) vrmRenderer.setSize(targetW, targetH, false);
            } else {
                const orbPx = Math.round(90 * scale);
                container.style.width = (orbPx + 40) + 'px';
                container.style.height = (orbPx + 40) + 'px';
                orbBtn.style.width = orbPx + 'px';
                orbBtn.style.height = orbPx + 'px';

                const winW = Math.round(Math.max(200, orbPx + 140));
                const winH = Math.round(Math.max(220, orbPx + 160));
                if (window.aiBackend && window.aiBackend.resizeOrbWindow) {
                    window.aiBackend.resizeOrbWindow(winW, winH);
                }

                if (headBone) {
                    const headPos = new THREE.Vector3();
                    headBone.getWorldPosition(headPos);
                    const camDist = Math.max(0.46, Math.min(1.0, size.y * 0.44));
                    vrmCamera.position.set(headPos.x, headPos.y - 0.03, headPos.z + camDist);
                    vrmCamera.lookAt(headPos.x, headPos.y - 0.03, headPos.z);
                } else {
                    const targetY = center.y + (size.y * 0.2);
                    const camDist = Math.max(0.5, size.y * 0.85);
                    vrmCamera.position.set(center.x, targetY, center.z + camDist);
                    vrmCamera.lookAt(center.x, targetY, center.z);
                }
                vrmCamera.aspect = 1.0;
                vrmCamera.updateProjectionMatrix();
                if (vrmRenderer) vrmRenderer.setSize(orbPx + 40, orbPx + 40, false);
            }
        }

        function getAppSettings() {
            if (window.aiBackend && window.aiBackend.getSettingsSync) {
                return window.aiBackend.getSettingsSync();
            }
            return JSON.parse(localStorage.getItem('nexus-settings')) || {};
        }

        function updateVisualMode(customSettings = null) {
            const settings = customSettings || getAppSettings();
            const mode = settings.avatarMode || 'globe';
            const vrmDisplayMode = settings.vrmDisplayMode || 'orb';
            const scale = settings.avatarScale || 1.0;
            console.log("[Orb] updateVisualMode:", mode, "vrmDisplayMode:", vrmDisplayMode, "scale:", scale);

            if (mode === 'vrm') {
                if (vrmCanvas) vrmCanvas.style.display = 'block';
                if (petAvatar) petAvatar.style.display = 'none';
                if (orbBtn) {
                    orbBtn.classList.add('vrm-mode');
                    if (vrmDisplayMode === 'full') {
                        orbBtn.classList.add('full-body');
                        container.classList.add('vrm-full-mode');
                        if (vrmCanvas) vrmCanvas.classList.add('full-body');
                    } else {
                        orbBtn.classList.remove('full-body');
                        container.classList.remove('vrm-full-mode');
                        if (vrmCanvas) vrmCanvas.classList.remove('full-body');
                    }
                }
                if (!isVRMInitialized) {
                    initVRMScene();
                } else {
                    applyOrbVRMFraming(vrmDisplayMode);
                    loadVRMModel();
                }
            } else {
                // Globe mode (default)
                if (vrmCanvas) {
                    vrmCanvas.style.display = 'none';
                    vrmCanvas.classList.remove('full-body');
                }
                if (orbBtn) {
                    orbBtn.classList.remove('vrm-mode', 'full-body');
                    const orbPx = Math.round(70 * scale);
                    orbBtn.style.width = orbPx + 'px';
                    orbBtn.style.height = orbPx + 'px';
                    container.style.width = (orbPx + 60) + 'px';
                    container.style.height = (orbPx + 60) + 'px';
                }
                if (container) container.classList.remove('vrm-full-mode');
                const orbPx = Math.round(70 * scale);
                const winW = Math.round(Math.max(200, orbPx + 140));
                const winH = Math.round(Math.max(220, orbPx + 160));
                if (window.aiBackend && window.aiBackend.resizeOrbWindow) {
                    window.aiBackend.resizeOrbWindow(winW, winH);
                }
                updateOrbVisualState(currentOrbState);
            }
        }

        // Mouse Wheel Scroll Zoom / Resize
        let isMouseOverOrb = false;
        container.addEventListener('mouseenter', () => { isMouseOverOrb = true; });
        container.addEventListener('mouseleave', () => { isMouseOverOrb = false; });

        let wheelDebounce = null;
        window.addEventListener('wheel', (e) => {
            if (isMouseOverOrb || e.ctrlKey || e.metaKey) {
                e.preventDefault();
                const settings = getAppSettings();
                let scale = settings.avatarScale || 1.0;
                scale += e.deltaY > 0 ? -0.05 : 0.05;
                scale = Math.max(0.5, Math.min(2.5, Math.round(scale * 100) / 100));
                const updated = { ...settings, avatarScale: scale };
                localStorage.setItem('nexus-settings', JSON.stringify(updated));
                if (window.aiBackend && window.aiBackend.saveSettings) {
                    window.aiBackend.saveSettings(updated);
                }
                if (wheelDebounce) clearTimeout(wheelDebounce);
                wheelDebounce = setTimeout(() => {
                    if (window.aiBackend && window.aiBackend.notifySettingsUpdated) {
                        window.aiBackend.notifySettingsUpdated(updated);
                    }
                }, 150);
                updateVisualMode(updated);
            }
        }, { passive: false });

        if (window.aiBackend && window.aiBackend.onWindowResized) {
            window.aiBackend.onWindowResized(() => {
                if (vrmRenderer && vrmCanvas && isVRMInitialized) {
                    const rect = vrmCanvas.getBoundingClientRect();
                    const w = rect.width || window.innerWidth;
                    const h = rect.height || window.innerHeight;
                    vrmRenderer.setSize(w, h, false);
                    if (vrmCamera) {
                        vrmCamera.aspect = w / h;
                        vrmCamera.updateProjectionMatrix();
                    }
                }
            });
        }

        // ══════════════════════════════════════════════════════════════════════
        // Visual State & Orb Controller
        // ══════════════════════════════════════════════════════════════════════
        function updateOrbVisualState(state) {
            currentOrbState = state;
            const settings = getAppSettings();
            const mode = settings.avatarMode || 'globe';

            if (mode === 'vrm') {
                if (petAvatar) petAvatar.style.display = 'none';
                return;
            }

            if (!petAvatar) return;
            
            const specificUrl = `${window.aiBackend.baseUrl}/pet/${state}?t=${Date.now()}`;
            const fallbackUrl = `${window.aiBackend.baseUrl}/avatar?t=${Date.now()}`;
            
            const img = new Image();
            img.onload = function() {
                petAvatar.src = specificUrl;
                petAvatar.style.display = 'block';
            };
            img.onerror = function() {
                const fallbackImg = new Image();
                fallbackImg.onload = function() {
                    petAvatar.src = fallbackUrl;
                    petAvatar.style.display = 'block';
                };
                fallbackImg.onerror = function() {
                    petAvatar.style.display = 'none';
                };
                fallbackImg.src = fallbackUrl;
            };
            img.src = specificUrl;
        }

        function setLocalOrbStatus(status) {
            try {
                if (window.aiBackend && window.aiBackend.setOrbStatus) {
                    window.aiBackend.setOrbStatus(status);
                }
            } catch(e) {}
            updateOrbVisualState(status);
        }

        window.aiBackend.onSettingsUpdated((newSettings) => {
            console.log("[Orb] onSettingsUpdated triggered with:", newSettings);
            const settings = newSettings || getAppSettings();
            updateVisualMode(settings);
            updateOrbVisualState(currentOrbState);
            if (isVRMInitialized) loadVRMModel(true);
            wakeWordErrorCount = 0;
            if (wakeWordRecognizer) { try { wakeWordRecognizer.stop(); } catch(e){} wakeWordRecognizer = null; }
            startWakeWordDetection();
        });

        // ══════════════════════════════════════════════════════════════════════
        // Context Menu & Interaction Listeners
        // ══════════════════════════════════════════════════════════════════════
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            contextMenu.classList.add('visible');

        document.addEventListener('click', (e) => {
            if (!contextMenu.contains(e.target)) contextMenu.classList.remove('visible');
        });

        menuChat.addEventListener('click', () => {
            window.aiBackend.toggleMainWindow();
            contextMenu.classList.remove('visible');

        menuSettings.addEventListener('click', () => {
            window.aiBackend.openSettings();
            contextMenu.classList.remove('visible');

        menuHide.addEventListener('click', () => {

        orbBtn.addEventListener('click', () => {

        // ══════════════════════════════════════════════════════════════════════
        // Audio, Speech Recognition & Wake Word
        // ══════════════════════════════════════════════════════════════════════
        let mediaRecorder = null;
        let audioChunks = [];
        let recognition = null;
        let currentMediaStream = null;
        let recordStartTime = 0;
        let speechDetected = false;

        async function loadLocales() {
            const settings = getAppSettings();
            const lang = settings.lang || 'en-US';
            try {
                const response = await fetch(`locales/${lang}.json`);
                uiStrings = await response.json();
            } catch (err) {
                console.error("Failed to load locales via fetch, attempting fallback.", err);
                if (lang === 'si-LK') {
                    uiStrings = {
                        "status_idle": "කතා කිරීමට ඔබන්න", "status_listening": "සවන් දෙමින්...", "status_listening_web": "සවන් දෙමින් (වෙබ්)...", "status_transcribing": "පරිවර්තනය කරමින්...", "status_thinking": "...", "status_researching": "🧬 තොරතුරු සොයමින්...", "status_done": "අවසන්", "status_error": "දෝෂයකි", "status_connection_error": "සම්බන්ධතා දෝෂයකි", "status_no_audio": "ශබ්දයක් නැත", "status_mic_error": "මයික්‍රෆෝන් දෝෂයක්: ", "status_mic_error_short": "මයික්‍රෆෝන් දෝෂයක්", "status_permission_denied": "අවසර ලබා දී නැත", "status_permission_error": "අවසර දෝෂයකි", "status_stt_error": "හඳුනාගැනීමේ දෝෂයක්", "status_could_not_hear": "නැවත උත්සහ කරන්න"
                    };
                } else {
                    uiStrings = {
                        "status_idle": "TAP TO ASK", "status_listening": "LISTENING (RAW)...", "status_listening_web": "LISTENING (WEB)...", "status_transcribing": "TRANSCRIBING...", "status_thinking": "...", "status_researching": "🧬 RESEARCHING...", "status_done": "DONE", "status_error": "ERROR", "status_connection_error": "CONNECTION ERROR", "status_no_audio": "NO AUDIO", "status_mic_error": "MIC ERROR: ", "status_mic_error_short": "MIC ERROR", "status_permission_denied": "PERMISSION DENIED", "status_permission_error": "PERMISSION ERROR", "status_stt_error": "STT ERROR", "status_could_not_hear": "COULD NOT HEAR YOU"
                    };
                }
            }
            if (!isListening && !isAgentSpeaking) {
                statusText.innerText = localize("status_idle");
            }
        }

        function localize(key) {
            return uiStrings[key] || key;
        }

        function startRecording() {
            if (isListening) return;
            if (isAgentSpeaking) {
                stopSpeaking();
            }
            if (wakeWordRecognizer) { try { wakeWordRecognizer.stop(); } catch(e){} wakeWordRecognizer = null; }
            const settings = getAppSettings();
            const engine = settings.sttEngine || 'local';
            if (engine === 'browser') {
                console.log("Using Web STT (Browser Native)");
                startBrowserSTT();
            } else {
                console.log("Using Backend STT (Engine: " + engine + ")");
                startBackendSTT();
            }
        }

        function startBrowserSTT() {
            if (!recognition) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    console.error("Web Speech API not supported.");
                    startBackendSTT();
                    return;
                }
                const settings = getAppSettings();
                recognition = new SpeechRecognition();
                recognition.lang = settings.lang || 'en-US';
                recognition.continuous = false;
                recognition.interimResults = true;

                recognition.onstart = () => {
                    isListening = true;
                    container.classList.add('listening');
                    statusText.innerText = localize("status_listening_web");
                    setLocalOrbStatus('listening');
                };

                recognition.onerror = (event) => {
                    console.error('Browser Speech Recognition Error:', event.error);
                    if (event.error === 'network') {
                        console.warn('Switching to Backend STT due to Network error');
                        window.useBackendSTT = true;
                        recognition.stop();
                        startBackendSTT();
                    } else if (event.error === 'not-allowed') {
                        statusText.innerText = localize("status_permission_denied");
                        isListening = false;
                        container.classList.remove('listening');
                        setLocalOrbStatus('idle');
                    } else {
                        statusText.innerText = localize("status_mic_error") + event.error.toUpperCase();
                        isListening = false;
                        container.classList.remove('listening');
                        setLocalOrbStatus('idle');
                    }
                };

                recognition.onresult = (event) => {
                    let transcript = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) transcript += event.results[i][0].transcript;
                    statusText.innerText = transcript.toUpperCase();
                    if (event.results[0].isFinal) {
                        recognition.stop();
                        finishVoiceInteraction(transcript);
                    }
                };

                recognition.onend = () => {
                    if (isListening && !window.useBackendSTT) {
                        container.classList.remove('listening');
                        isListening = false;
                        setLocalOrbStatus('idle');
                    }
                };
                
                setTimeout(() => {
                    if (!isListening && !isAgentSpeaking) {
                        statusText.innerText = localize("status_idle");
                        statusText.style.transform = 'scale(1)';
                    }
                }, 1500);
            }
            try { recognition.start(); } catch(e) { console.error(e); }
        }

        let audioBuffer = [];
        let scriptProcessor = null;
        let source = null;
        let audioContext = null;
        let wakeWordRecognizer = null;
        let wakeWordErrorCount = 0;
        let lastWakeWordStartTime = 0;

        function startWakeWordDetection() {
            if (wakeWordRecognizer || isListening || isAgentSpeaking) return;
            const settings = getAppSettings();
            if (!settings.voiceActivation) {
                return;
            }
            if (wakeWordErrorCount >= 3) {
                console.warn("Wake Word detection suspended due to repeated mic errors.");
                statusText.innerText = "MIC ACCESS ERROR";
                statusText.style.opacity = "0.7";
                return;
            }
            
            const assistantName = settings.name || "Kruuboo";
            statusText.innerText = "Listening for '" + assistantName + "'";
            statusText.style.opacity = "0.5";
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return;
            
            wakeWordRecognizer = new SpeechRecognition();
            wakeWordRecognizer.continuous = true;
            wakeWordRecognizer.interimResults = true;
            wakeWordRecognizer.lang = settings.lang || 'en-US';
            
            wakeWordRecognizer.onstart = () => {
                lastWakeWordStartTime = Date.now();
            };
            
            wakeWordRecognizer.onresult = (event) => {
                wakeWordErrorCount = 0;
                const s = getAppSettings();
                const name = (s.name || "Kruboo").toLowerCase();
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript.toLowerCase().trim();
                    if (transcript.includes(name)) {
                        console.log("Wake word '" + name + "' detected!");
                        statusText.innerText = "Waking up...";
                        try { wakeWordRecognizer.stop(); } catch(e){}
                        wakeWordRecognizer = null;
                        startRecording();
                        break;
                    }
                }
            };
            
            wakeWordRecognizer.onerror = (event) => {
                console.warn("Wake word listener error:", event.error);
                if (event.error === 'network' || event.error === 'no-speech') {
                    // Ignore transient network and no-speech events
                } else if (event.error === 'not-allowed') {
                    wakeWordErrorCount = 99;
                } else {
                    wakeWordErrorCount++;
                }
            };
            
            wakeWordRecognizer.onend = () => {
                wakeWordRecognizer = null;
                if (!isListening && !isAgentSpeaking && wakeWordErrorCount < 3) {
                    setTimeout(() => startWakeWordDetection(), 500);
                }
            };
            
            try { 
                lastWakeWordStartTime = Date.now();
                wakeWordRecognizer.start(); 
            } catch(e) {}
        }

        async function startBackendSTT() {
            if (isAgentSpeaking || (window.speechSynthesis && window.speechSynthesis.speaking) || activeAudio) return;
            try {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                currentMediaStream = stream;
                isListening = true;
                recordStartTime = Date.now();
                speechDetected = false;

                container.classList.add('listening');
                statusText.innerText = localize("status_listening");
                statusText.style.opacity = "1";
                setLocalOrbStatus('listening');
                
                source = audioContext.createMediaStreamSource(stream);
                
                const analyser = audioContext.createAnalyser();
                analyser.minDecibels = -70;
                analyser.smoothingTimeConstant = 0.1;
                analyser.fftSize = 512;
                source.connect(analyser);

                scriptProcessor = audioContext.createScriptProcessor(4096, 1, 1);
                
                audioBuffer = [];
                let lastSpeechTime = Date.now();
                const dataArray = new Uint8Array(analyser.frequencyBinCount);

                scriptProcessor.onaudioprocess = (event) => {
                    if (!isListening || isAgentSpeaking || (window.speechSynthesis && window.speechSynthesis.speaking) || activeAudio) return;
                    const inputData = event.inputBuffer.getChannelData(0);
                    audioBuffer.push(new Float32Array(inputData));

                    analyser.getByteFrequencyData(dataArray);
                    const sum = dataArray.reduce((a, b) => a + b, 0);
                    const avg = sum / dataArray.length;
                    
                    if (avg > 15) { 
                        speechDetected = true;
                        lastSpeechTime = Date.now();
                    } else if (speechDetected && (Date.now() - lastSpeechTime > 1500) && (Date.now() - recordStartTime > 2500)) { 
                        stopRecording();
                    }
                };

                source.connect(scriptProcessor);
                scriptProcessor.connect(audioContext.destination);

                setTimeout(() => { if (isListening) stopRecording(); }, 15000);
            } catch (err) {
                console.error('Could not start Backend STT:', err);
                isListening = false;
                container.classList.remove('listening');
                setLocalOrbStatus('idle');
                statusText.innerText = localize("status_mic_error_short");
                setTimeout(() => { statusText.innerText = localize("status_idle"); }, 2000);
            }
        }

        async function stopRecording() {
            if (!isListening) return;
            isListening = false;
            container.classList.remove('listening');
            setLocalOrbStatus('idle');

            if (scriptProcessor) {
                try { scriptProcessor.disconnect(); } catch(e){}
                scriptProcessor = null;
            }
            if (source) {
                try { source.disconnect(); } catch(e){}
                source = null;
            }
            if (currentMediaStream) {
                try {
                    currentMediaStream.getTracks().forEach(track => track.stop());
                } catch(e){}
                currentMediaStream = null;
            }
            if (audioContext && audioContext.state === 'running') {
                try { audioContext.suspend(); } catch(e){}
            }

            if (!audioBuffer || audioBuffer.length === 0) {
                statusText.innerText = localize("status_no_audio");
                setTimeout(() => { statusText.innerText = localize("status_idle"); }, 1500);
                startWakeWordDetection();
                return;
            }

            statusText.innerText = localize("status_transcribing");
            
            try {
                const totalSamples = audioBuffer.reduce((acc, b) => acc + b.length, 0);
                const resultBuffer = new Float32Array(totalSamples);
                let offset = 0;
                for (const b of audioBuffer) {
                    resultBuffer.set(b, offset);
                    offset += b.length;
                }

                const wavBlob = encodeWAVFromFloat32(resultBuffer, audioContext ? audioContext.sampleRate : 44100);
                
                const settings = getAppSettings();
                const formData = new FormData();
                formData.append('file', wavBlob, 'voice.wav');
                formData.append('language', settings.lang || 'en-US');
                if (settings.sttEngine === 'whisper' && settings.apiKey) {
                    formData.append('api_key', settings.apiKey);
                }

                const response = await fetch(`${window.aiBackend.baseUrl}/transcribe`, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                if (data.text && !data.text.includes("STT could not understand")) {
                    finishVoiceInteraction(data.text);
                } else {
                    statusText.innerText = localize("status_could_not_hear");
                    setTimeout(() => { statusText.innerText = localize("status_idle"); }, 2000);
                }
            } catch (err) {
                console.error('STT Pipeline Failure:', err);
                statusText.innerText = localize("status_stt_error");
            }
        }

        function encodeWAVFromFloat32(samples, sampleRate) {
            const buffer = new ArrayBuffer(44 + samples.length * 2);
            const view = new DataView(buffer);
            
            writeString(view, 0, 'RIFF');
            view.setUint32(4, 32 + samples.length * 2, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(view, 36, 'data');
            view.setUint32(40, samples.length * 2, true);
            
            let offset = 44;
            for (let i = 0; i < samples.length; i++, offset += 2) {
                const s = Math.max(-1, Math.min(1, samples[i]));
                view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
            }
            return new Blob([buffer], { type: 'audio/wav' });
        }

        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }

        // ══════════════════════════════════════════════════════════════════════
        // WebSocket Chat Query Handling
        // ══════════════════════════════════════════════════════════════════════
        let ws;
        let activeWSHandler = null;
        let pendingQuery = null;
        function setupWebSocket() {
            const token = "localhost";
            ws = new WebSocket(`${window.aiBackend.wsUrl}/ws/${token}`);
            ws.onopen = () => {
                console.log("Orb WS Connected");
                if (pendingQuery) {
                    const queryToSend = pendingQuery;
                    pendingQuery = null;
                    finishVoiceInteraction(queryToSend);
                }
            };
            ws.onclose = () => setTimeout(setupWebSocket, 3000);
            ws.onerror = (e) => console.error("Orb WS Error:", e);
        }
        setupWebSocket();

        async function finishVoiceInteraction(query) {
            statusText.innerText = localize("status_thinking");
            setLocalOrbStatus('thinking');
            
            try {
                const settings = getAppSettings();
                const selectedModel = settings.model || 'llama-3';
                let provider = 'local';
                if (selectedModel.startsWith('gpt')) provider = 'openai';
                else if (selectedModel.startsWith('claude')) provider = 'anthropic';
                else if (selectedModel.startsWith('deepseek')) provider = 'deepseek';
                else if (selectedModel.startsWith('grok')) provider = 'xai';

                let fullResponse = "";
                let sentenceBuffer = "";

                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: "chat_query",
                        payload: {
                            query: query,
                            is_voice: true,
                            chat_id: "voice",
                            assistant_name: settings.name || "Kruuboo",
                            llm_provider: provider,
                            llm_model: selectedModel,
                            api_key: settings.apiKey || "",
                            language: settings.lang || "en-US",
                            feeling: settings.feeling || "siri"
                        }
                    }));

                    const handleWSMessage = (event) => {
                        const data = JSON.parse(event.data);
                        
                        if (data.type === "chat_token") {
                            const token = data.payload.token;
                            if (token) {
                                fullResponse += token;
                                sentenceBuffer += token;
                                statusText.innerText = fullResponse.split('\n').pop().substring(0, 40).toUpperCase();

                                const sentenceMatch = sentenceBuffer.match(/[^.!?]*[.!?]\s*/);
                                if (sentenceMatch) {
                                    const sentence = sentenceMatch[0];
                                    sentenceBuffer = sentenceBuffer.replace(sentence, "");
                                    if (sentence.trim().length > 2) speakText(sentence);
                                }
                            }
                            if (data.payload.action === "deep_research_start") {
                                statusText.innerText = localize("status_researching");
                            }
                            if (data.payload.action === "visual_interpreter" || data.payload.action === "object_recognition") {
                                window.aiBackend.triggerAction(data.payload.action);
                            }
                        } else if (data.type === "chat_done") {
                            ws.removeEventListener('message', handleWSMessage);
                            activeWSHandler = null;
                            
                            if (sentenceBuffer.trim().length > 0) speakText(sentenceBuffer);

                            statusText.innerText = localize("status_done");
                            setLocalOrbStatus('idle');
                            if (!isAgentSpeaking && !(window.speechSynthesis && window.speechSynthesis.speaking) && !activeAudio) {
                                setTimeout(() => {
                                    if (!isAgentSpeaking && !isListening) startWakeWordDetection();
                                }, 600);
                            }

                            // Save to local history
                            const chats = JSON.parse(localStorage.getItem('nexus-chats')) || [{ id: Date.now(), title: 'Voice', messages: [] }];
                            chats[0].messages.push({ text: query, isUser: true, timestamp: Date.now() });
                            chats[0].messages.push({ text: fullResponse, isUser: false, timestamp: Date.now() });
                            localStorage.setItem('nexus-chats', JSON.stringify(chats));

                            // Suggestions / Sources logic
                            const suggestionCard = document.getElementById('suggestion-card');
                            const mdLinks = [...fullResponse.matchAll(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g)];
                            const realLinks = mdLinks.filter(l => 
                                !l[2].includes('siri.com') && 
                                !l[2].includes('kruuboo.com') && 
                                !l[1].toLowerCase().startsWith('what is') && 
                                !l[1].toLowerCase().startsWith('can you') &&
                                !l[1].toLowerCase().startsWith('how do') &&
                                !l[1].toLowerCase().startsWith('who is')
                            );
                            if (realLinks.length > 0) {
                                suggestionCard.innerHTML = `<span class="suggestion-label">Sources</span>`;
                                realLinks.slice(0, 4).forEach(l => suggestionCard.innerHTML += `<a href="#" onclick="require('electron').shell.openExternal('${l[2]}')">${l[1]}</a>`);
                                suggestionCard.style.display = 'flex';
                            } else {
                                suggestionCard.style.display = 'none';
                            }

                            setTimeout(() => { 
                                 statusText.innerText = localize("status_idle");
                                 suggestionCard.style.display = 'none';
                            }, 8000);
                        }
                    };
                    if (activeWSHandler) ws.removeEventListener('message', activeWSHandler);
                    activeWSHandler = handleWSMessage;
                    ws.addEventListener('message', handleWSMessage);
                } else {
                    pendingQuery = query;
                    statusText.innerText = "RECONNECTING...";
                    setupWebSocket();
                }
            } catch (e) { 
                console.error(e);
                statusText.innerText = localize("status_connection_error"); 
            }
        }

        // ══════════════════════════════════════════════════════════════════════
        // TTS / Speech Output & Dynamic Lip-Sync
        // ══════════════════════════════════════════════════════════════════════
        async function speakText(text) {
            const doc = new DOMParser().parseFromString(text, 'text/html');
            let speechContent = doc.body.textContent || "";
            speechContent = speechContent.split(/(?:Sources?|Refs?|Links?|Citations?)\s*[:\-]/i)[0];
            speechContent = speechContent.replace(/(?:https?:\/\/|www\.)[^\s]+/gi, '');
            speechContent = speechContent.replace(/[a-zA-Z0-9-]+\.[a-zA-Z]{2,}(?:\/[^\s]*)?/gi, (match) => {
                return (match.includes('/') || match.includes('google.com') || match.includes('bing.com')) ? '' : match;
            });
            speechContent = speechContent.replace(/[?&][a-zA-Z0-9]+=[^ \s]+/g, ''); 
            speechContent = speechContent.replace(/&[a-z]+;/g, '');
            
            let cleanText = speechContent
                .replace(/[*#_`~\\<>]/g, ' ') 
                .replace(/\s+/g, ' ') 
                .trim()
                .substring(0, 500);
            
            if (!cleanText || cleanText.length < 2) return;

            // Immediately mute/stop any active recording or wake word listening
            if (isListening) stopRecording();
            if (wakeWordRecognizer) {
                try { wakeWordRecognizer.stop(); } catch(e){}
                wakeWordRecognizer = null;
            }
            isAgentSpeaking = true;

            const settings = getAppSettings();
            const lang = settings.lang || "en-US";

            if (lang.includes('si')) {
                try {
                    console.log("Using Backend TTS for Sinhala...");
                    const response = await fetch(`${window.aiBackend.baseUrl}/tts`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text: cleanText, language: 'si' })
                    });
                    
                    if (!response.ok) throw new Error("TTS Backend Failed");
                    
                    const audioBlob = await response.blob();
                    const audioUrl = URL.createObjectURL(audioBlob);
                    const audio = new Audio(audioUrl);
                    activeAudio = audio;
                    
                    audio.onplay = () => { isAgentSpeaking = true; setLocalOrbStatus('speaking'); };
                    audio.onended = () => { 
                        isAgentSpeaking = false; 
                        activeAudio = null; 
                        setLocalOrbStatus('idle'); 
                        URL.revokeObjectURL(audioUrl); 
                        setTimeout(() => { if (!isAgentSpeaking && !isListening) startWakeWordDetection(); }, 600);
                    };
                    audio.play();
                    return;
                } catch (err) {
                    console.error("Backend TTS failed, falling back to Browser.", err);
                }
            }

            if (!window.speechSynthesis) return;

            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = lang;
            utterance.rate = 1.0;
            utterance.pitch = 1.1;

            utterance.onstart = () => { isAgentSpeaking = true; setLocalOrbStatus('speaking'); };
            utterance.onend = () => { 
                isAgentSpeaking = false; 
                setLocalOrbStatus('idle'); 
                setTimeout(() => { if (!isAgentSpeaking && !isListening) startWakeWordDetection(); }, 600);
            };
            utterance.onerror = () => { 
                isAgentSpeaking = false; 
                setLocalOrbStatus('idle'); 
                setTimeout(() => { if (!isAgentSpeaking && !isListening) startWakeWordDetection(); }, 600);
            };

            window.speechSynthesis.speak(utterance);
        }

        function stopSpeaking() {
            if (ws && activeWSHandler) {
                ws.removeEventListener('message', activeWSHandler);
                activeWSHandler = null;
            }
            if (activeAudio) {
                try {
                    activeAudio.pause();
                } catch (e) {}
                activeAudio = null;
            }
            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
            }
            isAgentSpeaking = false;
            setLocalOrbStatus('idle');
            statusText.innerText = localize("status_idle");
            startWakeWordDetection();
        }

        // ══════════════════════════════════════════════════════════════════════
        // Initialization
        // ══════════════════════════════════════════════════════════════════════
        window.addEventListener('load', () => {
            loadLocales();
            updateVisualMode();
            startWakeWordDetection();
            
            window.aiBackend.onVoiceTrigger(() => {
                if (!isListening && !isAgentSpeaking) {
                    startRecording();
                }
            });
        });

        statusText.innerText = localize("status_idle");
        
        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(stream => {
                stream.getTracks().forEach(track => track.stop());
                console.log('Mic ready');
            })
            .catch(err => {
                console.error("Mic Error:", err);
                statusText.innerText = localize("status_mic_error_short");
            });
    </script>
